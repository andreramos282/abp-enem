name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: API e modelo (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Estilo (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Testes (pytest)
        run: pytest -q

  web:
    name: Front-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Estilo (eslint + prettier)
        run: |
          npm run lint
          npm run format:check
      - name: Testes (vitest)
        run: npm test
      - name: Build
        run: npm run build
